<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pages - gofolio Admin</title>
	<link rel="stylesheet" href="/admin/static/assets/css/styles.css">
	<script src="/admin/static/assets/js/htmx.min.js" defer></script>
</head>
<body>
<header>
	<nav class="container">
		<h1><a href="/" style="color:white;text-decoration:none;">gofolio Admin</a></h1>
		<ul>
			<li><a href="/" style="color:white;">View Site</a></li>
			<li><a href="/api/auth/logout/" style="color:white;">Logout</a></li>
		</ul>
	</nav>
</header>

<main class="container">
	<h2>Pages</h2>

	<div style="display:flex;gap:1rem;margin-bottom:2rem;">
		<a href="/admin/pages/new/" class="btn btn-primary">+ New Page</a>
	</div>

	<table>
		<thead>
		<tr>
			<th>Title</th>
			<th>Slug</th>
			<th>Created</th>
			<th>Actions</th>
		</tr>
		</thead>
		{{template "pages_rows" .}}
	</table>
</main>
</body>
</html>
