<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pages - gofolio Admin</title>
	<link rel="stylesheet" href="/static/styles.css">
	<style>
		table { width: 100%; border-collapse: collapse; background: white; }
		th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; }
		th { background: #f9f9f9; }
		.actions { display: flex; gap: 0.5rem; }
	</style>
</head>
<body>
	<header>
		<nav class="container">
			<h1><a href="/" style="color:white;text-decoration:none;">gofolio Admin</a></h1>
			<ul>
				<li><a href="/" style="color:white;">View Site</a></li>
				<li><a href="/api/auth/logout/" style="color:white;">Logout</a></li>
			</ul>
		</nav>
	</header>

	<main class="container">
		<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
			<h2>Pages</h2>
			<a href="/admin/pages/new/" class="btn btn-primary">+ New Page</a>
		</div>

		<table id="pages-table">
			<thead>
				<tr>
					<th>Title</th>
					<th>Slug</th>
					<th>Created</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody id="pages-body">
				<tr><td colspan="4">Loading...</td></tr>
			</tbody>
		</table>
	</main>

	<script>
		async function loadPages() {
			const res = await fetch('/admin/api/pages/');
			const pages = await res.json();
			const tbody = document.getElementById('pages-body');

			tbody.innerHTML = pages.map(page => `
				<tr>
					<td><strong>${page.title}</strong></td>
					<td><code>${page.slug}/</code></td>
					<td>${new Date(page.created_at).toLocaleDateString()}</td>
					<td class="actions">
						<a href="/admin/pages/${page.id}/edit/">Edit</a>
						<a href="/pages/${page.slug}/" target="_blank">View</a>
						<a href="#" onclick="deletePage(${page.id})" style="color:red;">Delete</a>
					</td>
				</tr>
			`).join('') || '<tr><td colspan="4">No pages yet.</td></tr>';
		}

		async function deletePage(id) {
			if (!confirm('Delete this page?')) return;
			await fetch(`/admin/api/pages/${id}/`, { method: 'DELETE' });
			alert('Page deleted!');
			loadPages();
		}

		loadPages();
	</script>
</body>
</html>
