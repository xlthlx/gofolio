<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Settings - gofolio Admin</title>
	<link rel="stylesheet" href="/admin/static/assets/css/styles.css">
	<script src="/admin/static/assets/js/htmx.min.js" defer></script>
</head>
<body>
<header>
	<nav class="container">
		<h1><a href="/" style="color:white;text-decoration:none;">gofolio Admin</a></h1>
		<ul>
			<li><a href="/" style="color:white;">View Site</a></li>
			<li><a href="/api/auth/logout/" style="color:white;">Logout</a></li>
		</ul>
	</nav>
</header>

<main class="container">
	<h2>Settings</h2>

	<section>
		<h3>Site</h3>
		<p>Site title: {{with .Values}}{{with index . "site_title"}}{{.}}{{else}}goFolio{{end}}{{end}}</p>
		<p>Tagline: {{with .Values}}{{with index . "tagline"}}{{.}}{{else}}A simple Go CMS{{end}}{{end}}</p>
		{{template "site_settings" .}}
	</section>

	<section>
		<h3>Change password</h3>
		<form hx-post="/admin/settings/password/"
			  hx-target="#password-result"
			  hx-swap="innerHTML">
			<label for="new_password">New password</label>
			<input type="password" id="new_password" name="new_password"
				   autocomplete="new-password" minlength="8" required>

			<label for="confirm_password">Confirm password</label>
			<input type="password" id="confirm_password" name="confirm_password"
				   autocomplete="new-password" minlength="8" required>

			<button type="submit" class="btn btn-primary">Update password</button>
		</form>
		<div id="password-result"></div>
	</section>
</main>
</body>
</html>
