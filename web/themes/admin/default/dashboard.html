<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin Dashboard - gofolio</title>
	<link rel="stylesheet" href="/admin/static/assets/css/styles.css">
	<script src="/admin/static/assets/js/htmx.min.js" defer></script>
</head>
<body>
<header>
	<nav class="container">
		<h1><a href="/admin/dashboard/">gofolio Admin</a></h1>
		<ul>
			<li><a href="/">View Site</a></li>
			<li><a href="/api/auth/logout/">Logout</a></li>
		</ul>
	</nav>
</header>

<main class="container">
	<h2>Dashboard</h2>

	<div class="dashboard-grid">
		<div class="stat-card"><h3>Total Posts</h3><div class="value">{{.TotalPosts}}</div></div>
		<div class="stat-card"><h3>Published</h3><div class="value">{{.Published}}</div></div>
		<div class="stat-card"><h3>Drafts</h3><div class="value">{{.Drafts}}</div></div>
		<div class="stat-card"><h3>Total Pages</h3><div class="value">{{.TotalPages}}</div></div>
	</div>

	<div style="display:flex;gap:1rem;margin-bottom:2rem;">
		<a href="/admin/posts/new/" class="btn btn-primary">+ New Post</a>
		<a href="/admin/pages/" class="btn btn-secondary">Manage Pages</a>
		<a href="/admin/settings/" class="btn btn-secondary">Settings</a>
	</div>

	<div style="display:grid;grid-template-columns:250px 1fr;gap:2rem;">
		<aside class="sidebar-nav">
			<ul>
				<li><a href="/admin/dashboard/">Dashboard</a></li>
				<li><a href="/admin/posts/">Posts</a></li>
				<li><a href="/admin/pages/">Pages</a></li>
				<li><a href="/admin/settings/">Settings</a></li>
			</ul>
		</aside>

		<section>
			<h2>Recent Posts</h2>
			<div id="recent-posts"
				 hx-get="/admin/dashboard/recent/"
				 hx-trigger="every 30s"
				 hx-swap="innerHTML">
				{{template "recent_rows" .}}
			</div>
		</section>
	</div>
</main>
</body>
</html>
