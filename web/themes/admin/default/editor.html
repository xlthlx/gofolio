<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editor - gofolio</title>
	<link rel="stylesheet" href="/admin/static/assets/css/styles.css">
	<script src="/admin/static/assets/js/htmx.min.js" defer></script>
</head>
<body>
	<header>
		<nav class="container">
			<h1><a href="/">gofolio Admin</a></h1>
			<ul>
				<li><a href="/admin/">Dashboard</a></li>
				<li><a href="/api/auth/logout/">Logout</a></li>
			</ul>
		</nav>
	</header>

	<main class="container">
		
		<form id="editor-form" class="editor-form">
			<input type="hidden" id="post-id">
			
			<div class="form-group">
				<label for="title">Title</label>
				<input type="text" id="title" required>
			</div>

			<div class="form-group">
				<label for="slug">Slug (optional)</label>
				<input type="text" id="slug" placeholder="auto-generated from title">
			</div>

			<div class="form-group">
				<label for="content">Content</label>
				<textarea id="content"></textarea>
			</div>

			<div class="form-group">
				<label for="status">Status</label>
				<select id="status">
					<option value="draft">Draft</option>
					<option value="published">Published</option>
				</select>
			</div>

			<div class="form-actions">
				<button type="submit" class="btn btn-primary">Save Post</button>
				<a href="/admin/posts/" class="btn btn-secondary">Cancel</a>
			</div>
		</form>
	</main>
	<script src="/admin/static/assets/js/tinymce/tinymce.min.js"></script>
	<script>

		const postId = new URLSearchParams(window.location.search).get('id') ||
			window.location.pathname.match(/\/posts\/(\d+)\/edit\//)?.[1];

		async function loadEditor(editor) {
			if (postId) {
				const res = await fetch(`/admin/api/posts/${postId}/`);
				const post = await res.json();
				document.getElementById('post-id').value = post.id;
				document.getElementById('title').value = post.title;
				document.getElementById('slug').value = post.slug;
				document.getElementById('status').value = post.status;
				editor.setContent(post.content || '');
			}
		}

		tinymce.init({
			license_key: 'gpl',
			target: document.getElementById('content'),
			height: 400,
			menubar: '',
			plugins: [
				'advlist', 'autolink', 'link', 'image', 'lists', 'charmap', 'preview', 'anchor',
				'searchreplace', 'wordcount', 'visualblocks', 'visualchars', 'code', 'fullscreen',
				'media', 'table', 'emoticons', 'help'
			],
			toolbar1: 'styles bold italic strikethrough link bullist numlist alignleft aligncenter alignright image media table code',
			toolbar2: 'hr blockquote outdent indent anchor searchreplace charmap undo redo removeformat fullscreen wordcount help ',
			styles_toolbar: '',
			style_formats: [
				{title: 'Paragraph', format: 'p'},
				{title: 'Heading 2', format: 'h2'},
				{title: 'Heading 3', format: 'h3'},
				{title: 'Heading 4', format: 'h4'},
				{title: 'Heading 5', format: 'h5'},
				{title: 'Heading 6', format: 'h6'},
				{title: 'Code', format: 'code'},
				{title: 'Preformatted', format: 'pre'},
				{title: 'Strikethrough', format: 'strikethrough'},
				{title: 'Superscript', format: 'superscript'},
				{title: 'Subscript', format: 'subscript'}
			],
			setup: function(editor) {
				editor.on('change', function() {
					document.getElementById('content').value = editor.getContent();
				});
				editor.on('init', function() {
					loadEditor(editor);
				});
			}
		});

		const titleField = document.getElementById('title');
		const slugField = document.getElementById('slug');

		let slugEdited = slugField.value !== '';

		slugField.addEventListener('input', function() {
			slugEdited = slugField.value !== '';
		});

		const accents = {à:'a', á:'a', â:'a', ä:'a', è:'e', é:'e', ê:'e', ë:'e',
			ì:'i', í:'i', î:'i', ï:'i', ò:'o', ó:'o', ô:'o', ö:'o', õ:'o',
			ù:'u', ú:'u', û:'u', ü:'u', ç:'c', ñ:'n'};

		titleField.addEventListener('input', function(e) {
			if (!slugEdited) {
				let slug = e.target.value.toLowerCase().replace(
						/[àáâäãåèéêëìíîïòóôöõùúûüçñ]/g,
						c => accents[c] || c
				);
				slug = slug.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
				slugField.value = slug;
			}
		});

		document.getElementById('editor-form').addEventListener('submit', async function(e) {
			e.preventDefault();

			const postData = {
				title: document.getElementById('title').value,
				slug: document.getElementById('slug').value,
				content: tinymce.activeEditor.getContent(),
				status: document.getElementById('status').value
			};

			const url = postId ? `/admin/api/posts/${postId}/` : '/admin/api/posts/';
			const method = postId ? 'PUT' : 'POST';

			const res = await fetch(url, {
				method,
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(postData)
			});

			if (res.ok) {
				window.location.href = '/admin/posts/';
			} else {
				alert('Error saving post');
			}
		});
	</script>
</body>
</html>
