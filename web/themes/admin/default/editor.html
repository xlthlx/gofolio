{{define "editor_page"}}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editor - goFolio Admin</title>
	<link rel="stylesheet" href="/admin/static/assets/css/styles.css">
	<script src="/admin/static/assets/js/htmx.min.js" defer></script>
	<script src="/admin/static/assets/js/htmx-config.js" defer></script>
</head>
<body>
<header>
	<nav class="container">
		<h1><a href="/admin/" style="color:white;text-decoration:none;">goFolio Admin</a></h1>
		<ul>
			<li><a href="/admin/posts/" style="color:white;">Posts</a></li>
			<li><a href="/api/auth/logout/" style="color:white;">Logout</a></li>
		</ul>
	</nav>
</header>

<main class="container">
	<h2>{{if .Post.ID}}Edit post{{else}}New post{{end}}</h2>

	<form id="editor-form" class="editor-form"
		  method="post" action="/admin/posts/save/"
		  hx-post="/admin/posts/save/"
		  hx-target="#editor-result"
		  hx-swap="innerHTML">
		<input type="hidden" id="post-id" name="id" value="{{.Post.ID}}">

		<div class="form-group">
			<label for="title">Title</label>
			<input type="text" id="title" name="title" value="{{.Post.Title}}" required>
		</div>

		<div class="form-group">
			<label for="slug">Slug (optional)</label>
			<input type="text" id="slug" name="slug" value="{{.Post.Slug}}"
				   placeholder="auto-generated from title">
		</div>

		<div class="form-group">
			<label for="content">Content</label>
			<textarea id="content" name="content">{{.Post.Content}}</textarea>
		</div>

		<div class="form-group">
			<label for="status">Status</label>
			<select id="status" name="status">
				<option value="draft"{{if eq .Post.Status "draft"}} selected{{end}}>Draft</option>
				<option value="published"{{if eq .Post.Status "published"}} selected{{end}}>Published</option>
			</select>
		</div>

		<div class="form-actions">
			<button type="submit" class="btn btn-primary">Save Post</button>
			<a href="/admin/posts/" class="btn btn-secondary">Cancel</a>
		</div>
	</form>
	<div id="editor-result">{{template "editor_error" .}}</div>
</main>
<script src="/admin/static/assets/js/tinymce/tinymce.min.js"></script>
<script>
	// TinyMCE edits its own copy of the document, so it has to be pushed back
	// into the textarea before the form is sent, whether HTMX or the browser
	// sends it. This listener is registered before htmx is processed, so the
	// textarea is current by the time the request is serialised.
	document.getElementById('editor-form').addEventListener('submit', function() {
		tinymce.triggerSave();
	});

	tinymce.init({
		license_key: 'gpl',
		target: document.getElementById('content'),
		height: 400,
		menubar: '',
		plugins: [
			'advlist', 'autolink', 'link', 'image', 'lists', 'charmap', 'preview', 'anchor',
			'searchreplace', 'wordcount', 'visualblocks', 'visualchars', 'code', 'fullscreen',
			'media', 'table', 'emoticons', 'help'
		],
		toolbar1: 'styles bold italic strikethrough link bullist numlist alignleft aligncenter alignright image media table code',
		toolbar2: 'hr blockquote outdent indent anchor searchreplace charmap undo redo removeformat fullscreen wordcount help ',
		styles_toolbar: '',
		style_formats: [
			{title: 'Paragraph', format: 'p'},
			{title: 'Heading 2', format: 'h2'},
			{title: 'Heading 3', format: 'h3'},
			{title: 'Heading 4', format: 'h4'},
			{title: 'Heading 5', format: 'h5'},
			{title: 'Heading 6', format: 'h6'},
			{title: 'Code', format: 'code'},
			{title: 'Preformatted', format: 'pre'},
			{title: 'Strikethrough', format: 'strikethrough'},
			{title: 'Superscript', format: 'superscript'},
			{title: 'Subscript', format: 'subscript'}
		]
	});
</script>
</body>
</html>
{{end}}
{{define "editor_error"}}
{{if .Error}}<p style="color: #b00020;">{{.Error}}</p>{{end}}
{{end}}
