<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Editor - gofolio Admin</title>
    <link rel="stylesheet" href="/admin/static/assets/css/styles.css">
    <script src="/admin/static/assets/js/htmx.min.js" defer></script>
</head>
<body>
<header>
    <nav class="container">
        <h1><a href="/" style="color:white;text-decoration:none;">gofolio Admin</a></h1>
        <ul>
            <li><a href="/" style="color:white;">View Site</a></li>
            <li><a href="/api/auth/logout/" style="color:white;">Logout</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <div id="loading" class="loading">Loading editor...</div>
    <form id="page-form" class="editor-form hidden">
        <input type="hidden" id="page-id">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" required>
        </div>
        <div class="form-group">
            <label for="slug">Slug (optional)</label>
            <input type="text" id="slug" placeholder="auto-generated from title">
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content"></textarea>
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Page</button>
            <a href="/admin/pages/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</main>
<script src="/admin/static/assets/js/tinymce/tinymce.min.js"></script>
<script>
    const pageId = window.location.pathname.match(/\/pages\/(\d+)\/edit\//)?.[1];

    tinymce.init({
        license_key: 'gpl',
        target: document.getElementById('content'),
        height: 400,
        menubar: '',
        plugins: [
            'autoresize', 'advlist', 'autolink', 'link', 'image', 'lists', 'charmap', 'preview', 'anchor',
            'searchreplace', 'wordcount', 'visualblocks', 'visualchars', 'code', 'fullscreen',
            'media', 'table', 'emoticons', 'help'
        ],
        toolbar1: 'styles bold italic strikethrough link bullist numlist alignleft aligncenter alignright image media table code',
        toolbar2: 'hr blockquote outdent indent anchor searchreplace charmap undo redo removeformat fullscreen wordcount help ',
        styles_toolbar: '',
        style_formats: [
            {title: 'Paragraph', format: 'p'},
            {title: 'Heading 2', format: 'h2'},
            {title: 'Heading 3', format: 'h3'},
            {title: 'Heading 4', format: 'h4'},
            {title: 'Heading 5', format: 'h5'},
            {title: 'Heading 6', format: 'h6'},
            {title: 'Preformatted', format: 'pre'}
        ],
        setup: function(editor) {
            editor.on('change', function() {
                document.getElementById('content').value = editor.getContent();
            });
            editor.on('init', function() {
                loadEditor(editor);   // TinyMCE is ready — safe to load data now
            });
        }
    });

    document.getElementById('title').addEventListener('input', function(e) {
        if (!document.getElementById('slug').value) {
            const slug = e.target.value.toLowerCase().replace(/ /g, '-').replace(/[^\w-]/g, '');
            document.getElementById('slug').value = slug;
        }
    });

    async function loadEditor(editor) {
        if (pageId) {
            const res = await fetch(`/admin/api/pages/${pageId}/`);
            const page = await res.json();
            document.getElementById('page-id').value = page.id;
            document.getElementById('title').value = page.title;
            document.getElementById('slug').value = page.slug;
            document.getElementById('status').value = page.status;
            editor.setContent(page.content || '');
        }
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('page-form').classList.remove('hidden');
    }

    document.getElementById('page-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const pageData = {
            title: document.getElementById('title').value,
            slug: document.getElementById('slug').value,
            content: tinymce.activeEditor.getContent()
        };
        const url = pageId ? `/admin/api/pages/${pageId}/` : '/admin/api/pages/';
        const method = pageId ? 'PUT' : 'POST';
        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(pageData)
        });
        if (res.ok) {
            window.location.href = '/admin/pages/';
        } else {
            alert('Error saving page');
        }
    });
</script>
</body>
</html>
