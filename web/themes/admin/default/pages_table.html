{{define "pages_rows"}}
<tbody id="pages-rows">
{{if not .Pages}}
<tr><td colspan="4">No pages yet.</td></tr>
{{end}}
{{range .Pages}}
<tr>
    <td>{{.Title}}</td>
    <td>{{.Slug}}</td>
    <td>{{.CreatedAt.Format "02/01/2006 15:04"}}</td>
    <td>
        <a class="btn btn-secondary" href="/admin/pages/{{.ID}}/edit/">Edit</a>
        <button class="btn btn-error"
                hx-delete="/admin/api/pages/{{.ID}}/"
                hx-confirm="Delete '{{.Title}}'?"
                hx-target="closest tr"
                hx-swap="outerHTML">Delete</button>
    </td>
</tr>
{{end}}
</tbody>
{{end}}
