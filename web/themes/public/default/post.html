{{define "post_page"}}
<!DOCTYPE html>
<html lang="en">
{{template "site_head" .}}
<body hx-boost="true">
{{template "site_nav" .}}
<main class="container">
	<article class="post-card">
		<h1>{{.Post.Title}}</h1>
		<p class="post-meta">{{.Post.CreatedAt.Format "2 January 2006"}}</p>
		{{.Content}}
	</article>

	<p><a class="btn btn-secondary" href="/">Back to all posts</a></p>
</main>
</body>
</html>
{{end}}
