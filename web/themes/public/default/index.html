{{define "index_page"}}
<!DOCTYPE html>
<html lang="en">
{{template "site_head" .}}
<!-- Boosting the page makes navigation a body swap: the server still renders
     complete pages, and the links that leave this theme or return JSON opt out
     below in site_nav, since a swap would arrive without the other stylesheet. -->
<body hx-boost="true">
{{template "site_nav" .}}
<main class="container">
	<p class="post-meta">{{.Site.Tagline}}</p>

	<div class="post-list">
		{{if not .Posts}}
		<p>Nothing published yet.</p>
		{{end}}
		{{range .Posts}}
		<article class="post-card">
			<h2><a href="/posts/{{.Slug}}/">{{.Title}}</a></h2>
			<p class="post-meta">{{.CreatedAt.Format "2 January 2006"}}</p>
			<a class="btn btn-primary" href="/posts/{{.Slug}}/">Read more</a>
		</article>
		{{end}}
	</div>
</main>
</body>
</html>
{{end}}
