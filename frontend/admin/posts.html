<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Posts - gopress Admin</title>
	<link rel="stylesheet" href="/static/styles.css">
	<style>
		table { width: 100%; border-collapse: collapse; background: white; }
		th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; }
		th { background: #f9f9f9; }
		.status-draft { color: #666; }
		.status-published { color: green; }
		.actions { display: flex; gap: 0.5rem; }
	</style>
</head>
<body>
	<header>
		<nav class="container">
			<h1><a href="/" style="color:white;text-decoration:none;">gopress Admin</a></h1>
			<ul>
				<li><a href="/" style="color:white;">View Site</a></li>
				<li><a href="/api/auth/logout/" style="color:white;">Logout</a></li>
			</ul>
		</nav>
	</header>

	<main class="container">
		<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
			<h2>Posts</h2>
			<a href="/admin/posts/new/" class="btn btn-primary">+ New Post</a>
		</div>

		<table id="posts-table">
			thead>
				<tr>
					<th>Title</th>
					<th>Status</th>
					<th>Created</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody id="posts-body">
				<tr><td colspan="4">Loading...</td></tr>
			</tbody>
		</table>
	</main>

	<script>
		async function loadPosts() {
			const res = await fetch('/admin/api/posts/');
			const posts = await res.json();
			const tbody = document.getElementById('posts-body');

			tbody.innerHTML = posts.map(post => `
				<tr>
					<td><strong>${post.title}</strong></td>
					<td class="status-${post.status}">${post.status}</td>
					<td>${new Date(post.created_at).toLocaleDateString()}</td>
					<td class="actions">
						<a href="/admin/posts/${post.id}/edit/">Edit</a>
						<a href="/posts/${post.slug}/" target="_blank">View</a>
						<a href="#" onclick="deletePost(${post.id}, '${post.slug}')" style="color:red;">Delete</a>
					</td>
				</tr>
			`).join('') || '<tr><td colspan="4">No posts yet.</td></tr>';
		}

		async function deletePost(id, slug) {
			if (!confirm('Delete this post?')) return;
			
			await fetch(`/admin/api/posts/${id}/`, { method: 'DELETE' });
			alert('Post deleted!');
			loadPosts();
		}

		loadPosts();
	</script>
</body>
</html>
